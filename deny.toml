[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained and comes through katui's cosmic-text with no upgrade available; it parses only fonts katui bundles" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained and comes through rumqttc 0.25, the latest; it only reads the system certificate store" },
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102 comes through rumqttc 0.25, the latest; we encrypt and authenticate every message end to end, so a broker certificate flaw cannot expose or forge a game" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102 through rumqttc, as above" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102 through rumqttc, as above" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102 through rumqttc, as above" },
  { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102 through rumqttc, as above" },
]

[licenses]
version = 2
allow = [
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
