[package]
name = "kess"
description = "Chess on a glossy 3D board in your terminal, against a bot, on one keyboard, or online"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/h4ks-com/kess"
publish = false

# cargo binstall downloads the archive the release workflow attaches
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[features]
default = ["sound"]
sound = ["dep:rodio"]

[dependencies]
chacha20poly1305 = "0.11"
fontdue = "0.9"
getrandom = "0.4"
hkdf = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
katui = { version = "0.1.0", features = ["app", "game"] }
rodio = { version = "0.23", default-features = false, features = ["playback"], optional = true }
rumqttc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shakmaty = "0.30"
thiserror = "2"

[lints.rust]
unsafe_code = "deny"
unknown_lints = { level = "allow", priority = -2 }
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
indexing_slicing = "warn"
cognitive_complexity = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# a nursery lint: assert!(x.is_empty()) reads better than the assert_eq form
assert_is_empty = "allow"

# decoding and scaling the bundled art is slow without optimizations
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
