name: Bug report
description: Something in kess breaks or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what kess did instead. A screenshot helps for anything you see.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kess version
      description: The release you installed, or the commit you built.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      description: The terminal app with its version, whether you run tmux, and the OS.
      placeholder: kitty 0.40 on macOS 26, no tmux
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Play the bot
        - Host a game
        - Join a game
        - Two players
        - The start menu
